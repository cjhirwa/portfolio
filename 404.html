<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>Page Not Found | Jean Claude Hirwa</title>
    <meta name="robots" content="noindex">

    <link href="assets/img/me.png" rel="icon">
    <link href="assets/img/me.png" rel="apple-touch-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #0f9d8c;
            --accent-light: #35e888;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 12% 18%, rgba(15, 157, 140, 0.22), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(15, 157, 140, 0.12), transparent 38%),
                radial-gradient(circle at 78% 82%, rgba(15, 157, 140, 0.16), transparent 45%),
                #040404;
            color: #fff;
            font-family: "Inter", sans-serif;
            text-align: center;
            padding: 20px;
        }

        .wrap {
            max-width: 480px;
        }

        .code {
            font-family: "Sora", sans-serif;
            font-size: 96px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 {
            font-family: "Sora", sans-serif;
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 12px 0;
        }

        p {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a.home-btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            text-decoration: none;
            font-family: "Sora", sans-serif;
            transition: background 0.3s ease;
        }

        a.home-btn:hover {
            background: var(--accent-light);
            color: #040404;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>This page doesn't exist</h1>
        <p>The page you're looking for may have been moved or removed. Let's get you back on track.</p>
        <a class="home-btn" href="/portfolio/">Back to Home</a>
    </div>
</body>

</html>
